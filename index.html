<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mehul Srivastava | Portfolio</title>
  <meta name="description" content="Portfolio of Mehul Srivastava — final-year CS (AI/ML) student working towards DevOps and SRE roles, and event photographer.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">

  <!-- Open Graph -->
  <meta property="og:title" content="Mehul Srivastava | Portfolio">
  <meta property="og:description" content="Software engineer, photographer, and creative builder. Explore my projects and visual work.">
  <meta property="og:image" content="assets/favicon.svg">
  <meta property="og:type" content="website">

  <!-- Preconnect to CDNs -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- AOS CSS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css?v=10" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@300;400;500&family=Space+Mono&display=swap"
    rel="stylesheet" />

  <script type="module" src="./js/main.js?v=20"></script>
</head>

<body>

  <!-- Preloader -->
  <div id="moon-loading" class="done" aria-live="polite" aria-busy="false">
    <div class="moon-loading-inner">
      <div class="preloader-moon">
        <svg viewBox="0 0 60 60" width="60" height="60">
          <circle cx="30" cy="30" r="24" fill="none" stroke="rgba(200,184,255,0.15)" stroke-width="1"/>
          <circle cx="30" cy="30" r="24" fill="none" stroke="rgba(200,184,255,0.5)" stroke-width="1"
                  stroke-dasharray="150.8" stroke-dashoffset="150.8" stroke-linecap="round"
                  class="preloader-arc"/>
          <circle cx="30" cy="30" r="8" fill="rgba(200,184,255,0.08)"/>
          <circle cx="26" cy="27" r="2" fill="rgba(200,184,255,0.06)"/>
          <circle cx="35" cy="33" r="1.5" fill="rgba(200,184,255,0.05)"/>
        </svg>
      </div>
      <span class="moon-loading-label">Entering orbit</span>
      <div class="moon-loading-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="moon-loading-fill"></div>
      </div>
    </div>
  </div>



  <section id="hero">
    <span class="welcome-line">Welcome to</span>
    <span class="welcome-line cursive">my world</span>
    <div class="hint">Scroll to reveal</div>
  </section>

  <div id="scroll-space"></div>
  <div class="hover-bg coding-bg">
    <canvas id="matrix-canvas"></canvas>
  </div>

  <div class="hover-bg creativity-bg">
    <canvas id="creativity-canvas"></canvas>
  </div>

  <div id="labels">
    <a href="pages/coding.html" class="label left">Coding</a>
    <a href="pages/creativity.html" class="label right">Creativity</a>
  </div>

  <!-- Bottom nav for sub-pages -->
  <nav id="bottom-nav">
    <a href="pages/about.html" class="bottom-link">About</a>
    <a href="pages/contact.html" class="bottom-link">Contact</a>
  </nav>

  <!-- Easter egg tooltip -->
  <div id="easter-egg-toast" class="easter-toast">🧑‍🚀 You found the astronaut!</div>




  <!-- Arm Rig — scroll-driven hands navigation -->
  <div id="arm-rig" aria-hidden="true">
    <!-- Spill overlays (fine-pointer hover only) -->
    <div class="spill-overlay spill-maroon" id="spill-maroon"></div>
    <div class="spill-overlay spill-teal" id="spill-teal"></div>

    <!-- Left hand: Coding Track (maroon) -->
    <div class="hand-element hand-left" id="hand-left" data-side="left">
      <a href="pages/coding.html" class="hand-link" aria-label="View coding projects" tabindex="0">
        <img src="assets/hands/Left_Arm_fullcanvas.png"    class="hand-layer arm-layer"    alt="" loading="eager">
        <img src="assets/hands/Left_Palm_fullcanvas.png"   class="hand-layer palm-layer"   alt="" loading="lazy">
        <img src="assets/hands/Left_Finger_fullcanvas.png" class="hand-layer finger-layer" alt="Creative track — reach out" loading="lazy">
      </a>
    </div>

    <!-- Right hand: Creativity Track (teal) -->
    <div class="hand-element hand-right" id="hand-right" data-side="right">
      <a href="pages/creativity.html" class="hand-link" aria-label="View creative work" tabindex="0">
        <img src="assets/hands/Right_Arm_fullcanvas.png"    class="hand-layer arm-layer-r"    alt="" loading="lazy">
        <img src="assets/hands/Right_Palm_fullcanvas.png"   class="hand-layer palm-layer-r"   alt="" loading="lazy">
        <img src="assets/hands/Right_Finger_fullcanvas.png" class="hand-layer finger-layer-r" alt="Coding track — reach out" loading="lazy">
      </a>
    </div>
  </div>

  <!-- AOS Script -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ once: true });
  </script>
</body>

</html>
