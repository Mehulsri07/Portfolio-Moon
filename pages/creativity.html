<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design & Creativity | Portfolio</title>
  <meta name="description" content="A visual portfolio showcasing photography, design, and creative exploration through a curated gallery of work.">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <meta property="og:title" content="Design & Creativity | Portfolio">
  <meta property="og:description" content="Photography and creative visual works.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono&family=Tangerine:wght@700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/pages.css?v=4" />
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    /* ── Hero Section ── */
    .hero {
      padding: 10rem 3rem 4rem;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 6rem;
      left: -10%;
      width: 50%;
      height: 300px;
      background: radial-gradient(ellipse, rgba(200, 184, 255, 0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-label {
      font-family: var(--mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--accent);
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-out) 0.2s forwards;
    }

    h1 {
      font-weight: 300;
      font-size: clamp(2.8rem, 6vw, 5rem);
      margin: 0 0 1.5rem 0;
      letter-spacing: -0.04em;
      line-height: 1.05;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-out) 0.35s forwards;
    }

    h1 em {
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 300;
      max-width: 520px;
      line-height: 1.7;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-out) 0.5s forwards;
    }

    .hero-divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, var(--accent), transparent);
      margin: 3rem 0;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-out) 0.6s forwards;
    }

    .photo-count {
      font-family: var(--mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-out) 0.7s forwards;
    }

    /* ── Gallery Section ── */
    .gallery-section {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 3rem 6rem;
    }

    /* ── Masonry Grid ── */
    .masonry {
      columns: 3;
      column-gap: 16px;
      opacity: 0;
      animation: fadeIn 1s var(--ease-out) 0.8s forwards;
    }

    /* ── Gallery Item ── */
    .gallery-item {
      break-inside: avoid;
      margin-bottom: 16px;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      background: var(--surface);
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.6s var(--ease-out), filter 0.6s var(--ease-out);
      will-change: transform;
    }

    .gallery-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
          transparent 40%,
          rgba(10, 10, 11, 0.6) 100%);
      opacity: 0;
      transition: opacity 0.4s var(--ease-out);
      pointer-events: none;
    }

    .gallery-item:hover img {
      transform: scale(1.04);
    }

    .gallery-item:hover::after {
      opacity: 1;
    }

    .gallery-item .item-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transform: translateY(10px);
      opacity: 0;
      transition: all 0.4s var(--ease-out);
      pointer-events: none;
      z-index: 2;
    }

    .gallery-item:hover .item-overlay {
      transform: translateY(0);
      opacity: 1;
    }

    .item-overlay .view-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .item-overlay .view-icon svg {
      width: 16px;
      height: 16px;
      stroke: white;
      fill: none;
      stroke-width: 2;
    }

    .item-overlay .item-label {
      font-family: 'Tangerine', cursive;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 0.03em;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s var(--ease-out), visibility 0.4s;
    }

    .lightbox.active {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s var(--ease-out), visibility 0s; /* visible at once so focus can move in */
    }

    .lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
    }

    /* Split layout: image left, info right */
    .lightbox-content {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 3.5rem;
      max-width: 88vw;
      max-height: 88vh;
      transform: scale(0.94) translateY(12px);
      opacity: 0;
      transition: transform 0.5s var(--ease-out), opacity 0.4s var(--ease-out);
    }

    .lightbox.active .lightbox-content {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .lightbox-img-wrap {
      flex: 0 0 auto;
      max-height: 82vh;
      display: flex;
      align-items: center;
    }

    .lightbox-content img {
      max-height: 82vh;
      max-width: 58vw;
      width: auto;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      display: block;
    }

    .lightbox-info {
      flex: 0 0 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
      opacity: 0;
      transform: translateX(16px);
      transition: opacity 0.45s var(--ease-out) 0.15s, transform 0.45s var(--ease-out) 0.15s;
    }

    .lightbox.active .lightbox-info {
      opacity: 1;
      transform: translateX(0);
    }

    .lightbox-title {
      font-family: 'Tangerine', cursive;
      font-weight: 700;
      font-size: 3.2rem;
      color: var(--text);
      line-height: 1.1;
      letter-spacing: 0.02em;
    }

    .lightbox-divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    .lightbox-desc {
      font-family: var(--sans);
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.7;
      font-weight: 300;
    }

    .lightbox-counter-inline {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .lightbox-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 2;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s, transform 0.3s var(--ease-out);
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: rotate(90deg);
    }

    .lightbox-close svg {
      width: 18px;
      height: 18px;
      stroke: white;
      fill: none;
      stroke-width: 2;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s, transform 0.3s var(--ease-out);
    }

    .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .lightbox-nav.prev { left: 1.5rem; }
    .lightbox-nav.next { right: 1.5rem; }
    .lightbox-nav.prev:hover { transform: translateY(-50%) translateX(-2px); }
    .lightbox-nav.next:hover { transform: translateY(-50%) translateX(2px); }

    .lightbox-nav svg {
      width: 20px;
      height: 20px;
      stroke: white;
      fill: none;
      stroke-width: 2;
    }

    /* hide old counter element */
    .lightbox-counter { display: none; }

    @media (max-width: 768px) {
      .lightbox-content {
        flex-direction: column;
        gap: 1.5rem;
        max-width: 92vw;
        align-items: flex-start;
      }
      .lightbox-content img {
        max-width: 88vw;
        max-height: 55vh;
      }
      .lightbox-info {
        flex: none;
        transform: translateY(10px);
        transition: opacity 0.45s var(--ease-out) 0.15s, transform 0.45s var(--ease-out) 0.15s;
      }
      .lightbox.active .lightbox-info {
        transform: translateY(0);
      }
      .lightbox-title { font-size: 2.4rem; }
      .lightbox-nav,
      .lightbox-nav.prev:hover,
      .lightbox-nav.next:hover { top: auto; bottom: 1.25rem; transform: none; }
      .lightbox-nav.prev { left: 1.25rem; }
      .lightbox-nav.next { right: 1.25rem; }
      .lightbox-content { padding-bottom: 4.5rem; }
    }

    /* ── Responsive ── */
    @media (max-width: 1024px) {
      .masonry {
        columns: 2;
      }

      .hero {
        padding: 9rem 2rem 3rem;
      }

      .gallery-section {
        padding: 0 2rem 4rem;
      }

      .nav {
        padding: 0.5rem 2rem;
      }
    }

    @media (max-width: 640px) {
      .masonry {
        columns: 1;
        column-gap: 12px;
      }

      .gallery-item {
        margin-bottom: 12px;
      }

      .hero {
        padding: 8rem 1.5rem 2.5rem;
      }

      .gallery-section {
        padding: 0 1.5rem 3rem;
      }

      .nav {
        padding: 0.35rem 1.5rem;
      }

      h1 {
        font-size: 2.2rem;
      }
    }
  </style>
</head>

<body>

  <!-- Navigation -->
  <nav class="nav" id="nav">
    <a href="../index.html" class="back">
      <span class="back-arrow">←</span> Mehul Srivastava
    </a>
    <div class="nav-links">
      <a href="coding.html" class="nav-link">Coding</a>
      <a href="creativity.html" class="nav-link active">Creativity</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </nav>
  <div class="mobile-menu" id="mobile-menu">
    <a href="coding.html">Coding</a><a href="creativity.html">Creativity</a>
    <a href="about.html">About</a><a href="contact.html">Contact</a>
    <a href="../index.html">Home</a>
  </div>

  <!-- Hero -->
  <section class="hero" id="hero">
    <div class="hero-label">Portfolio — Visual Works</div>
    <h1>Through the <em>Lens</em>,<br>Into the Frame.</h1>
    <p class="subtitle">Stage, festival and street photography: light, motion and the moment right before it
      passes.</p>
    <div class="hero-divider"></div>
    <div class="photo-count" id="photo-count"></div>
  </section>

  <!-- Gallery — built dynamically from data/photos.json -->
  <section class="gallery-section" id="gallery">
    <div class="masonry" id="masonry-grid"></div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>All works © Mehul Srivastava</p>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close lightbox">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
    </button>
    <button class="lightbox-nav prev" id="lightbox-prev" aria-label="Previous image">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
    </button>
    <div class="lightbox-content" id="lightbox-content">
      <div class="lightbox-img-wrap">
        <img id="lightbox-img" src="" alt="Full view">
      </div>
      <div class="lightbox-info" id="lightbox-info">
        <div class="lightbox-title" id="lightbox-title"></div>
        <div class="lightbox-divider"></div>
        <div class="lightbox-desc" id="lightbox-desc"></div>
        <div class="lightbox-counter-inline" id="lightbox-counter"></div>
      </div>
    </div>
    <button class="lightbox-nav next" id="lightbox-next" aria-label="Next image">
      <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18" /></svg>
    </button>
  </div>

  <script>
    // ── Dynamic Gallery from data/photos.json ──
    const BASE = '../Images/Portfolio_Creativity/';
    const ICON_SVG = `<svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>`;

    let imagesData = [];
    let currentIndex = 0;

    const grid        = document.getElementById('masonry-grid');
    const photoCount  = document.getElementById('photo-count');
    const lightbox    = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxTitle = document.getElementById('lightbox-title');
    const lightboxDesc  = document.getElementById('lightbox-desc');
    const counter       = document.getElementById('lightbox-counter');

    // Scroll-reveal observer
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.style.opacity = '1';
          entry.target.style.transform = 'translateY(0)';
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

    function buildGallery(photos) {
      imagesData = photos.map(p => ({
        src: BASE + p.file,
        title: p.title,
        desc: p.desc
      }));

      photoCount.textContent = `${photos.length} Photograph${photos.length !== 1 ? 's' : ''}`;

      photos.forEach((p, i) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.tabIndex = 0;
        item.setAttribute('role', 'button');
        item.setAttribute('aria-label', `View photo: ${p.title}`);
        item.dataset.index = i;
        item.style.opacity = '0';
        item.style.transform = 'translateY(30px)';
        item.style.transition = `opacity 0.7s ${0.05 * i}s var(--ease-out), transform 0.7s ${0.05 * i}s var(--ease-out)`;
        item.innerHTML = `
          <img src="${BASE + p.file}" alt="${p.title}" loading="lazy" decoding="async">
          <div class="item-overlay">
            <span class="item-label">${p.title}</span>
            <div class="view-icon">${ICON_SVG}</div>
          </div>`;
        item.addEventListener('click', () => openLightbox(i));
        item.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(i); }
        });
        grid.appendChild(item);
        revealObserver.observe(item);
      });
    }

    // Load photos.json
    fetch('../data/photos.json')
      .then(r => r.json())
      .then(buildGallery)
      .catch(err => {
        console.error('Failed to load photos.json:', err);
        photoCount.textContent = 'The photos could not be loaded. Refresh to try again.';
      });

    let opener = null;

    function openLightbox(index) {
      opener = document.activeElement;
      currentIndex = index;
      updateLightbox();
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
      document.getElementById('lightbox-close').focus();
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
      opener?.focus();
    }

    function updateLightbox() {
      const data = imagesData[currentIndex];
      const info = document.getElementById('lightbox-info');
      info.style.transition = 'none';
      info.style.opacity = '0';
      info.style.transform = 'translateX(16px)';

      lightboxImg.src = data.src;
      lightboxImg.alt = data.title;
      lightboxTitle.textContent = data.title;
      lightboxDesc.textContent = data.desc;
      counter.textContent = `${visualOrder().indexOf(currentIndex) + 1} / ${imagesData.length}`;

      requestAnimationFrame(() => {
        info.style.transition = 'opacity 0.45s var(--ease-out) 0.1s, transform 0.45s var(--ease-out) 0.1s';
        info.style.opacity = '1';
        info.style.transform = 'translateX(0)';
      });
    }

    // The masonry columns fill top to bottom, so DOM order runs down each column.
    // Step through photos the way the page reads instead: top to bottom, then left to right.
    function visualOrder() {
      return [...grid.children]
        .sort((a, b) => a.offsetTop - b.offsetTop || a.offsetLeft - b.offsetLeft)
        .map(el => Number(el.dataset.index));
    }

    function navigate(dir) {
      const order = visualOrder();
      const pos = order.indexOf(currentIndex);
      currentIndex = order[(pos + dir + order.length) % order.length];
      updateLightbox();
    }

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-backdrop').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-prev').addEventListener('click', (e) => { e.stopPropagation(); navigate(-1); });
    document.getElementById('lightbox-next').addEventListener('click', (e) => { e.stopPropagation(); navigate(1); });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });

    // Swipe between photos on touch screens
    let touchX = null;
    lightbox.addEventListener('touchstart', (e) => { touchX = e.changedTouches[0].clientX; }, { passive: true });
    lightbox.addEventListener('touchend', (e) => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1);
    });

  </script>

  <script src="../js/menu.js"></script>
  <script type="module">import { initTransitions } from "../js/transitions.js?v=2"; initTransitions();</script>
</body>

</html>
