<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Mehul Srivastava</title>
  <!-- GitHub Pages serves this for any missing path, so links are absolute to the site root -->
  <link rel="icon" type="image/svg+xml" href="/Portfolio-Moon/assets/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Inter:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090921;
      --text: #f8f8fa;
      --cream: #e2d9c6;
      --muted: #9aa0b8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--cream); color: var(--bg); }

    /* The moon parked on the right edge, as on the landing page */
    .moon {
      position: fixed;
      top: 50%;
      right: 0;
      width: min(110vh, 120vw);
      transform: translate(50%, -50%);
      opacity: 0.85;
      pointer-events: none;
    }

    main {
      position: relative;
      width: min(560px, calc(100vw - 55vh - 12vw));
      margin-left: 7vw;
    }
    .code {
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      color: var(--muted);
    }
    h1 {
      margin-top: 1rem;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: clamp(2.6rem, 6vw, 4.5rem);
      line-height: 1.05;
      color: var(--cream);
    }
    p.lede {
      max-width: 40ch;
      margin-top: 1.25rem;
      font-size: 1.05rem;
      font-weight: 300;
      line-height: 1.7;
      color: rgba(248, 248, 250, 0.82);
    }
    .home {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      margin-top: 2.25rem;
      padding: 0 1.4rem;
      border: 1px solid rgba(226, 217, 198, 0.55);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--cream);
      text-decoration: none;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .home:hover { background: var(--cream); color: var(--bg); }
    .home:focus-visible { outline: 1px solid var(--cream); outline-offset: 4px; }

    @media (max-width: 768px) {
      .moon { width: 90vw; opacity: 0.3; }
      main { width: auto; margin: 0 1.5rem; }
    }
  </style>
</head>
<body>
  <img class="moon" src="/Portfolio-Moon/assets/moon-disc.webp" alt="" aria-hidden="true" width="640" height="640">
  <main>
    <p class="code">404</p>
    <h1>Drifted out of orbit.</h1>
    <p class="lede">There's nothing at this address. It may have moved when About and Contact joined the home page.</p>
    <a class="home" href="/Portfolio-Moon/">Back to the home page</a>
  </main>
</body>
</html>
